apply plugin: 'com.android.library'
**APPLY_PLUGINS**

// ABI Ads: GMA Next-Gen — giữ phía trên block EDM (com.abi.ads.unity/docs/android-build-unity-2022-jdk11.md)
configurations.configureEach {
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
    resolutionStrategy {
        // Tránh D8 NPE với bản mới khi dùng AGP 7.4 / R8 cũ (Unity 2022.3)
        force 'com.google.errorprone:error_prone_annotations:2.20.0'
        force 'androidx.webkit:webkit:1.11.0'
    }
}

dependencies {
    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.1.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
// Android Resolver Dependencies Start
    implementation 'androidx.appcompat:appcompat:1.6.1' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:4
    implementation 'androidx.cardview:cardview:1.0.0' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:8
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:5
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2' // Assets/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:17
    implementation 'androidx.multidex:multidex:2.0.1' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:12
    implementation 'com.airbnb.android:lottie:5.0.2' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:11
    implementation 'com.android.installreferrer:installreferrer:2.1' // Assets/AppsFlyer/Editor/AppsFlyerDependencies.xml:7
    implementation 'com.applovin.mediation:google-adapter:24.1.0.0' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:16
    implementation 'com.applovin.mediation:google-ad-manager-adapter:24.1.0.0' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:15
    // implementation 'com.applovin:applovin-sdk:13.6.0' // Assets/MaxSdk/AppLovin/Editor/Dependencies.xml:4
    implementation 'com.applovin:applovin-sdk:13.6.2' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:14
    implementation 'com.appsflyer:af-android-sdk:6.17.5' // Assets/AppsFlyer/Editor/AppsFlyerDependencies.xml:5
    implementation 'com.appsflyer:purchase-connector:2.2.0' // Assets/AppsFlyer/Editor/AppsFlyerDependencies.xml:8
    implementation 'com.appsflyer:unity-wrapper:6.17.81' // Assets/AppsFlyer/Editor/AppsFlyerDependencies.xml:6
    implementation 'com.facebook.shimmer:shimmer:0.5.0' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:9
    implementation 'com.google.ads.mediation:applovin:13.6.2.0' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:13
    implementation 'com.google.android.gms:play-services-base:18.7.2' // Assets/Firebase/Editor/AppDependencies.xml:17
    implementation 'com.google.android.material:material:1.9.0' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:6
    implementation 'com.google.firebase:firebase-analytics:23.0.0' // Assets/Firebase/Editor/RemoteConfigDependencies.xml:15
    implementation 'com.google.firebase:firebase-analytics-unity:13.0.0' // Assets/Firebase/Editor/AnalyticsDependencies.xml:18
    implementation 'com.google.firebase:firebase-app-unity:13.0.0' // Assets/Firebase/Editor/AppDependencies.xml:22
    implementation 'com.google.firebase:firebase-common:22.0.0' // Assets/Firebase/Editor/AppDependencies.xml:13
    implementation 'com.google.firebase:firebase-config:23.0.0' // Assets/Firebase/Editor/RemoteConfigDependencies.xml:13
    implementation 'com.google.firebase:firebase-config-unity:13.0.0' // Assets/Firebase/Editor/RemoteConfigDependencies.xml:20
    implementation 'com.intuit.sdp:sdp-android:1.0.6' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:10
// Android Resolver Dependencies End
**DEPS**}

// Android Resolver Exclusions Start
android {
  packagingOptions {
      exclude ('/lib/arm64-v8a/*' + '*')
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
      exclude ('/lib/x86/*' + '*')
      exclude ('/lib/x86_64/*' + '*')
  }
}
// Android Resolver Exclusions End
android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    compileSdkVersion **APIVERSION**
    buildToolsVersion '**BUILDTOOLS**'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion **MINSDKVERSION**
        targetSdkVersion **TARGETSDKVERSION**
        ndk {
            abiFilters **ABIFILTERS**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
    }

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING_OPTIONS**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
