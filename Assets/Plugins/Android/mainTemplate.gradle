    implementation 'com.applovin.mediation:google-adapter:24.1.0.0' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:31
    implementation 'com.applovin.mediation:google-ad-manager-adapter:24.1.0.0' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:30
    // implementation 'com.applovin:applovin-sdk:13.6.0' // Assets/MaxSdk/AppLovin/Editor/Dependencies.xml:4
    implementation 'com.applovin:applovin-sdk:13.6.2' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:29
