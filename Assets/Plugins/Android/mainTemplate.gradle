apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
**APPLY_PLUGINS**

// ABI Ads: GMA classic — giữ phía trên block EDM (com.abi.ads.unity/docs/android-build-unity-6.md)
configurations.configureEach {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'androidx.lifecycle') {
                details.useVersion '2.6.2'
                details.because 'ProcessLifecycleOwner.Companion (GMA banner refresh)'
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.3.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
// Android Resolver Dependencies Start
    implementation 'androidx.appcompat:appcompat:1.7.0' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:11
    implementation 'androidx.cardview:cardview:1.0.0' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:15
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:12
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.6.2' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:26
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:24
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:22
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:23
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:25
    implementation 'androidx.multidex:multidex:2.0.1' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:19
    implementation 'androidx.recyclerview:recyclerview:1.3.2' // Packages/com.abi.ads.unity/Editor/ABIAdsDependencies.xml:14
